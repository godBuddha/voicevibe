name: yupvox-clone

networks:
  internal:

volumes:
  pgdata:
  miniodata:
  media:
  models:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yupvox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: yupvox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yupvox"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # One-shot: tạo bucket S3 nếu chưa có (idempotent — an toàn khi redeploy).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-yupvox}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$S3_BUCKET"
    networks: [internal]

  api:
    build:
      context: ./backend
      target: api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://yupvox:${POSTGRES_PASSWORD}@postgres:5432/yupvox
      REDIS_URL: redis://redis:6379/0
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set in .env}
      YUPVOX_ADMIN_KEY: ${YUPVOX_ADMIN_KEY:-}
      YUPVOX_API_KEYS: ${YUPVOX_API_KEYS:-dev-key-1}
      MEDIA_ROOT: /media
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-yupvox}
    ports:
      - "8000:8000"
    volumes:
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

  # Worker AI: target `worker` (torch + faster-whisper + pyannote + vieneu).
  # Cần GPU: uncomment deploy.resources trên máy có nvidia-container-toolkit.
  worker:
    build:
      context: ./backend
      target: worker
    environment:
      DATABASE_URL: postgresql+psycopg://yupvox:${POSTGRES_PASSWORD}@postgres:5432/yupvox
      REDIS_URL: redis://redis:6379/0
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set in .env}
      MEDIA_ROOT: /media
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-yupvox}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - media:/media
      - models:/models/hf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]
