name: yupvox-clone

networks:
  internal:

volumes:
  pgdata:
  miniodata:
  media:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yupvox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: yupvox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yupvox"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://yupvox:${POSTGRES_PASSWORD}@postgres:5432/yupvox
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      YUPVOX_API_KEYS: ${YUPVOX_API_KEYS:-dev-key-1}
    ports:
      - "8000:8000"
    volumes:
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal]

  # Worker AI: cần GPU khi chạy thật (xem README phần phần cứng).
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -l info -Q media -c 1
    environment:
      DATABASE_URL: postgresql+psycopg://yupvox:${POSTGRES_PASSWORD}@postgres:5432/yupvox
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - media:/media
      - models:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bỏ comment khi chạy trên máy có GPU + nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks: [internal]

volumes:
  models:
