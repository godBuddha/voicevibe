name: selftests

on: [push, pull_request]

jobs:
  offline-selftests:
    # Tất cả test chạy offline — KHÔNG cần GPU, không tải model AI.
    # Pipeline thật (STT/dub GPU) được verify bằng scripts/d*_smoke.py trên box GPU.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # BẮT BUỘC: `cache: pip` mặc định đi tìm **/requirements.txt hoặc
          # **/pyproject.toml — repo này KHÔNG có cả hai (deps nằm ở
          # backend/requirements-*.txt). Thiếu dòng này thì setup-python fail
          # ngay và job chết TRƯỚC KHI chạy test nào: CI "đỏ" suốt 11 lần push
          # trong khi toàn bộ test thực ra xanh.
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-worker.txt
      - name: Install ffmpeg (dub_pipeline selftest mixes audio via ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install API test deps
        # `pysubs2` cần cho test_subtitle — trong production nó nằm ở image worker
        # (nơi pipeline phụ đề chạy), không nằm ở image api.
        run: pip install fastapi "uvicorn[standard]" "sqlalchemy>=2.0" httpx cryptography pydantic "celery[redis]" python-multipart pysubs2
      - name: Run offline selftests
        env:
          PYTHONPATH: .
          YUPVOX_INLINE: "1"
        run: |
          # Chạy HẾT mọi suite rồi mới kết luận — không dừng ở suite đỏ đầu tiên.
          # Một lần chạy cho biết toàn cảnh hỏng/hở, thay vì sửa xong mới lộ cái
          # tiếp theo. `pipefail` để mã thoát là của python chứ không phải của tee.
          set -o pipefail
          SUITES=(
            "tests/test_day2.py"
            "tests/test_providers.py"
            "tests/test_settings.py"
            "tests/test_ui_js.py"
            "tests/test_theme.py"
            "tests/test_license_compliance.py"
            "tests/test_auth.py"
            "tests/test_migrations.py"
            "tests/test_providers_admin.py"
            "tests/test_ci_config.py"
            "tests/test_ratelimit.py"
            "tests/test_subtitle.py"
            "app.pipelines.dub --selftest"
            "app.pipelines.stt --selftest"
            "app.pipelines.translate --selftest"
            "app.pipelines.tts --selftest"
            "app.pipelines.subtitle --selftest"
            "app.pipelines.dub_pipeline --selftest"
          )
          : > /tmp/results.txt
          : > /tmp/selftest.log
          for s in "${SUITES[@]}"; do
            if [[ "$s" == tests/* ]]; then cmd=(python "$s"); else cmd=(python -m $s); fi
            if "${cmd[@]}" 2>&1 | tee -a /tmp/selftest.log; then
              echo "$s|PASS" >> /tmp/results.txt
            else
              echo "$s|FAIL" >> /tmp/results.txt
            fi
          done
          echo
          echo "===================== TỔNG HỢP ====================="
          column -s'|' -t /tmp/results.txt
      - name: Publish test summary
        # `always()`: phải chạy kể cả khi bước trên đỏ — nếu không, lần chạy hỏng
        # lại là lần duy nhất không có bảng kết quả để đọc.
        if: always()
        run: |
          {
            echo "## YupVox-Clone — offline test results"
            echo
            echo "| Suite | Result |"
            echo "|---|---|"
            if [[ -s /tmp/results.txt ]]; then
              while IFS='|' read -r name status; do
                if [[ "$status" == PASS ]]; then icon="✅"; else icon="❌"; fi
                echo "| \`$name\` | $icon $status |"
              done < /tmp/results.txt
              pass=$(grep -c '|PASS$' /tmp/results.txt || true)
              fail=$(grep -c '|FAIL$' /tmp/results.txt || true)
              echo
              echo "**$pass passed, $fail failed**"
            else
              echo "| _không có kết quả — bước cài đặt/khởi động đã hỏng_ | ❌ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any suite failed
        if: always()
        run: |
          if [[ ! -s /tmp/results.txt ]] || grep -q '|FAIL$' /tmp/results.txt; then
            echo "Có suite đỏ hoặc không chạy được suite nào:"
            cat /tmp/results.txt 2>/dev/null || echo "(/tmp/results.txt trống)"
            exit 1
          fi
          echo "Tất cả suite xanh."
      - name: Compose + Caddy config sanity
        # `config -q` chỉ xác nhận YAML hợp lệ — nó KHÔNG biết image có tồn tại,
        # container có healthcheck, hay có đang chạy bằng root. Bản cũ trỏ vào
        # `minio/minio:latest` (đã bị xoá khỏi Docker Hub): `config` vẫn xanh
        # trong khi stack không pull nổi image nào. Vì vậy có check_deploy.py.
        run: |
          cd ..
          python scripts/check_deploy.py
          export SETTINGS_MASTER_KEY=x POSTGRES_PASSWORD=x APP_DOMAIN=example.com
          docker compose config -q && echo "compose config OK"
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q \
            && echo "compose + GPU override config OK"
          docker compose --profile proxy config -q && echo "compose + proxy profile OK"
          docker run --rm -e APP_DOMAIN=example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile \
            && echo "Caddyfile OK"
